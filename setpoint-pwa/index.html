<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#111827;--mut:#64748b;--bd:#dbe1ea;--a:#2563eb;--b:#ea580c;--ok:#16a34a;--dn:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#93a0c0;--bd:#26304f;--a:#4f8cff;--b:#ff8a3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#93a0c0;--bd:#26304f;--a:#4f8cff;--b:#ff8a3d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:980px;margin:0 auto;padding:12px}
h1{margin:0;font-size:28px;letter-spacing:2px}h1 b{color:var(--a)}h2,h3{margin:.3em 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.97)}button:disabled{opacity:.4}
button.pri{background:var(--a);color:#fff;border-color:var(--a)}button.dn{color:var(--dn)}
button.big{width:100%;padding:18px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
form,.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,textarea,select{width:100%}textarea{min-height:110px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:12px;text-align:center}
.t0{border-color:var(--a)}.t1{border-color:var(--b)}
.side h2{font-size:clamp(15px,4vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:clamp(80px,26vw,200px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.t0 .sc{color:var(--a)}.t1 .sc{color:var(--b)}
.pt0{background:var(--a);color:#fff;border-color:var(--a);margin:10px 0 8px;min-height:84px}
.pt1{background:var(--b);color:#fff;border-color:var(--b);margin:10px 0 8px;min-height:84px}
.side .row button{flex:1;padding:12px 6px}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar button{flex:1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:13px}
.ban{background:var(--ok);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin:10px 0}
.log{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.log button{padding:4px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:20px 20px 0 0;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
.tw{overflow-x:auto}
:root[data-p="ocean"]{--a:#0ea5e9;--b:#f43f5e}:root[data-p="forest"]{--a:#10b981;--b:#d97706}:root[data-p="violet"]{--a:#8b5cf6;--b:#14b8a6}
.hero{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:14px}.hero h1{color:#fff;font-size:36px}.hero h1 b{opacity:.8;color:#fff}.hero p{margin:6px 0 16px;opacity:.92}.hero button{background:#fff;color:#111;border:0}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}.mt{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}.pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:10px 0}.res .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res .s{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.mc .row button{flex:1;padding:10px 8px}
.pal{display:flex;gap:10px;align-items:center;justify-content:center;margin:20px 0 6px;flex-wrap:wrap}.sw{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--bd);background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%)}.sw.on{border-color:var(--tx)}
.rg{display:grid;gap:14px}.prow{display:grid;grid-template-columns:60px 1fr auto auto;gap:6px;margin:6px 0;align-items:center}.prow button{padding:8px 12px}.prow .lc{display:flex;gap:4px;align-items:center;margin:0;font-size:13px;white-space:nowrap}.prow input[type=checkbox]{width:auto}
@media(min-width:700px){.sheet{border-radius:20px;align-self:center}.rg{grid-template-columns:1fr 1fr}}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.box,.card{border:1px solid #999}#app{max-width:none}}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script>
/* ============ SETPOINT v0.1 ============
 Arquitetura: o estado de uma partida é um REGISTRO DE EVENTOS (match.events).
 Placar, sets e vencedor são sempre CALCULADOS por replay(). Isso torna
 desfazer/corrigir triviais e prepara estatísticas, rotação e líbero (novos tipos de evento).
 Camadas: Store (localStorage) → Regras (replay) → Views (HTML) → Ações (eventos de clique). */

/* ---- Store: trocar por API/banco depois sem mexer nas views ---- */
const KEY='setpoint:v1';let DB={matches:[]},cur=null,view='home',flow={};
try{DB=JSON.parse(localStorage.getItem(KEY))||DB}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const SK={attack:'Ataque',block:'Bloqueio',serve:'Saque',error:'Erro adversário'};
const hm=t=>new Date(t).toLocaleTimeString('pt-BR');
const dur=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(s)};
/* cronômetro: começa no 1º ponto e para no ponto final (calculado, então desfazer reabre o relógio) */
const elapsed=s=>s.start?(s.done?s.end:Date.now())-s.start:0;

/* ---- Regras ---- */
const target=(m,no)=>{const r=m.rules,tot=r.setsToWin*2-1;return(no===tot&&tot>1)?r.decPts:r.pts};
function replay(m){
  const r=m.rules;let sc=[0,0],no=1,w=[0,0],sets=[],done=false,start=null,end=null;
  for(const e of m.events){
    e.set=no;
    if(e.type==='point'){
      if(start===null)start=e.t;sc[e.team]++;e.sc=[...sc];
      if(Math.max(...sc)>=target(m,no)&&Math.abs(sc[0]-sc[1])>=r.diff){
        const t=sc[0]>sc[1]?0:1;w[t]++;sets.push({no,sc:[...sc],w:t});sc=[0,0];no++;
        if(w[t]>=r.setsToWin){done=true;end=e.t}
      }
    }else e.sc=[...sc];
  }
  return{sc,no,w,sets,done,start,end};
}
const evText=(e,m)=>{const T=i=>esc(m.teams[i].name);
  if(e.type==='point')return e.skill==='error'?T(e.team)+': erro adversário'+(e.p?' ('+esc(e.p)+')':'')+(e.lib?' · líbero: '+esc(e.lib):''):T(e.team)+': '+SK[e.skill]+(e.p?' — '+esc(e.p):'');
  if(e.type==='to')return 'Tempo técnico — '+T(e.team);
  if(e.type==='sub')return 'Substituição '+T(e.team)+': sai '+esc(e.out||'?')+', entra '+esc(e.in||'?');
  return 'Obs: '+esc(e.text)};

/* ---- Modal ---- */
const openM=h=>{$('#modal').innerHTML='<div class="ov" data-a="close"><div class="sheet">'+h+'</div></div>'};
const closeM=()=>{$('#modal').innerHTML=''};
/* líbero (p.l): não aparece em saque nem bloqueio */
const lbl=p=>(p.n?'#'+p.n+' ':'')+p.name+(p.l?' (L)':'');
const roster=(i,skill)=>cur.teams[i].players.filter(p=>!(p.l&&!cur.rules.libServe&&(skill==='serve'||skill==='block'))).map(lbl);
const libs=i=>cur.teams[i].players.filter(p=>p.l).map(lbl);

/* ---- Views ---- */
function home(){
  const ms=[...DB.matches].reverse();
  return '<div class="hero"><h1>SET<b>POINT</b></h1><p>Súmula digital de vôlei — rápida, simples e pronta para a quadra.</p>'+
  '<button class="big" data-a="new">+ Nova partida</button></div><h3>Partidas</h3>'+
  (ms.length?ms.map(m=>{const s=replay(m);return '<div class="mc"><div class="mt"><b>'+esc(m.name)+'</b><span class="pill'+(s.done?'':' on')+'">'+(s.done?'Encerrada':'Em andamento')+'</span></div><div class="res"><span class="n" style="color:var(--a)">'+esc(m.teams[0].name)+'</span><span class="s">'+s.w[0]+' × '+s.w[1]+'</span><span class="n" style="color:var(--b)">'+esc(m.teams[1].name)+'</span></div><div class="mut">'+new Date(m.created).toLocaleString('pt-BR')+'</div><div class="row" style="margin-top:10px"><button data-a="open" data-id="'+m.id+'">'+(s.done?'Abrir':'Continuar')+'</button><button data-a="rep" data-id="'+m.id+'">Súmula</button><button data-a="editm" data-id="'+m.id+'">Editar</button><button class="dn" data-a="rm" data-id="'+m.id+'">Excluir</button></div></div>'}).join(''):'<p class="mut">Nenhuma partida ainda. Crie a primeira para começar.</p>')+
  pal()+'<div class="row" style="margin-top:12px"><button style="flex:1" data-a="exp">Exportar backup</button><button style="flex:1" data-a="imp">Importar backup</button></div><input type="file" id="impf" accept="application/json,.json" hidden><p class="mut" style="text-align:center">Dados salvos neste aparelho. Faça backup de vez em quando.</p>';
}
function setup(){
  return '<div class="top"><h1>Nova partida</h1><button data-a="home">Voltar</button></div><form onsubmit="return false">'+
  '<label>Nome / identificação</label><input id="f_name" placeholder="Ex.: Treino ACM Osasco — 02/11">'+
  '<div class="g2"><div><label>Equipe A</label><input id="f_ta" value="Equipe A"></div><div><label>Equipe B</label><input id="f_tb" value="Equipe B"></div></div>'+
  '<div class="rg">'+rosterBox('a')+rosterBox('b')+'</div><p class="mut">Troque o nome pela jogadora/atleta (o nº é o da camisa). Marque “Líb.” no líbero.</p>'+
  '<label>Regras</label><select id="f_pre"><option value="3,25,2,15">Oficial — melhor de 5 (25 pts, set decisivo 15)</option><option value="2,25,2,15">Melhor de 3 (25 pts, decisivo 15)</option><option value="1,25,2,25">Set único de treino</option><option value="c">Personalizada</option></select>'+
  '<div class="g4"><div><label>Sets p/ vencer</label><input id="f_sw" type="number" min="1" value="3"></div><div><label>Pontos do set</label><input id="f_pts" type="number" min="1" value="25"></div><div><label>Dif. mínima</label><input id="f_df" type="number" min="1" value="2"></div><div id="dpw"><label>Pts decisivo</label><input id="f_dp" type="number" min="1" value="15"></div></div>'+
  '<label>Formação</label><select id="f_mode"><option value="6">6 jogadores — líbero joga como os demais (pode sacar)</option><option value="7">7 jogadores — líbero não saca nem bloqueia</option></select>'+'<label>Tempos técnicos (por equipe, por set)</label><select id="f_to"><option value="0">Sem tempos</option><option value="1">1 tempo</option><option value="2" selected>2 tempos</option><option value="3">3 tempos</option></select>'+'<p class="mut">Sets para vencer: 3 = melhor de 5. O set decisivo usa pontuação própria (o campo some quando basta 1 set).</p>'+
  '<button class="big pri" data-a="create">Iniciar partida</button></form>';
}
function live(){
  const m=cur,s=replay(m),shown=s.done?s.sets[s.sets.length-1].sc:s.sc;
  const side=i=>'<section class="side t'+i+'"><h2>'+esc(m.teams[i].name)+'</h2><div class="sc">'+shown[i]+'</div><div class="mut">Sets: <b>'+s.w[i]+'</b></div><button class="big pt'+i+'" data-a="pt" data-t="'+i+'"'+(s.done?' disabled':'')+'>+ PONTO</button><div class="row">'+toBtn(m,s,i)+'<button data-a="sub" data-t="'+i+'"'+(s.done?' disabled':'')+'>Subst.</button></div></section>';
  const win=s.w[0]>s.w[1]?0:1;
  return '<div class="top"><button data-a="home">‹ Início</button><div style="text-align:center"><b>'+esc(m.name)+'</b><div class="mut">'+(s.done?'Partida encerrada':'Set '+s.no+' · até '+target(m,s.no)+' (dif. '+m.rules.diff+')')+'</div></div><button data-a="rep" data-id="'+m.id+'">Súmula</button></div>'+
  (s.done?'<div class="ban">Fim! Vencedor: '+esc(m.teams[win].name)+' ('+s.w[win]+' sets a '+s.w[1-win]+')</div><div class="bar"><button class="pri" data-a="restart">Reiniciar partida</button><button data-a="rep" data-id="'+m.id+'">Súmula</button></div>':'')+
  '<div class="mut" style="text-align:center;margin-bottom:6px">⏱ Tempo de jogo: <b id="clk">'+dur(elapsed(s))+'</b></div><div class="live">'+side(0)+side(1)+'</div>'+
  '<div style="text-align:center;margin-top:8px">'+s.sets.map(x=>'<span class="chip">Set '+x.no+': '+x.sc[0]+'–'+x.sc[1]+'</span>').join('')+'</div>'+
  '<div class="bar"><button data-a="undo"'+(m.events.length?'':' disabled')+'>↶ Desfazer</button><button data-a="note">Observação</button><button data-a="editm">Editar</button></div>'+
  '<div class="box"><b>Últimos registros</b>'+(m.events.length?[...m.events].reverse().slice(0,8).map(e=>'<div class="log"><span><span class="mut">S'+e.set+' '+e.sc[0]+'–'+e.sc[1]+'</span> '+evText(e,m)+'</span><span class="row">'+(e.type==='point'?'<button data-a="edit" data-id="'+e.id+'">✎</button>':'')+'<button class="dn" data-a="del" data-id="'+e.id+'">✕</button></span></div>').join(''):'<p class="mut">Nada registrado ainda.</p>')+'</div>';
}
function report(){
  const m=cur,s=replay(m),R=m.rules,win=s.done?(s.w[0]>s.w[1]?0:1):-1;
  const cnt={};m.events.filter(e=>e.type==='point').forEach(e=>{const c=cnt[e.team]=cnt[e.team]||{attack:0,block:0,serve:0,error:0};c[e.skill]++});
  const pl={},P=(t,p)=>pl[t+'|'+p]=pl[t+'|'+p]||{t,p,attack:0,block:0,serve:0,lib:0,x:0};
  m.events.filter(e=>e.type==='point').forEach(e=>{if(e.p){const t=e.skill==='error'?1-e.team:e.team,o=P(t,e.p);if(e.skill==='error')o.x++;else o[e.skill]++}if(e.lib)P(e.team,e.lib).lib++});
  const tot=x=>x.attack+x.block+x.serve+x.lib,top=Object.values(pl).filter(x=>tot(x)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,5);
  const c=(t,k)=>(cnt[t]||{})[k]||0;
  return '<div class="top noprint"><button data-a="back">‹ Voltar</button><button class="pri" data-a="print">Imprimir / salvar PDF</button></div>'+
  '<div class="box"><h1>SET<b>POINT</b> — Súmula</h1><p><b>'+esc(m.name)+'</b><br>ID '+m.id.toUpperCase()+' · '+new Date(m.created).toLocaleString('pt-BR')+'<br>Duração: '+dur(elapsed(s))+(s.done?'':' (em andamento)')+'<br>Regras: '+(R.setsToWin*2-1)+' sets máx., '+R.pts+' pts (decisivo '+R.decPts+'), diferença mínima '+R.diff+'.</p>'+
  '<h3>Resultado: '+esc(m.teams[0].name)+' '+s.w[0]+' × '+s.w[1]+' '+esc(m.teams[1].name)+'</h3>'+(win>=0?'<p>Vencedor: <b>'+esc(m.teams[win].name)+'</b></p>':'<p class="mut">Partida em andamento.</p>')+
  '<div class="tw"><table><tr><th>Set</th><th>'+esc(m.teams[0].name)+'</th><th>'+esc(m.teams[1].name)+'</th></tr>'+s.sets.map(x=>'<tr><td>'+x.no+'</td><td>'+x.sc[0]+'</td><td>'+x.sc[1]+'</td></tr>').join('')+(s.done?'':'<tr><td>'+s.no+' (atual)</td><td>'+s.sc[0]+'</td><td>'+s.sc[1]+'</td></tr>')+'</table></div>'+
  '<h3>Pontos por fundamento</h3><div class="tw"><table><tr><th>Equipe</th><th>Ataque</th><th>Bloqueio</th><th>Saque</th><th>Erro adv.</th></tr>'+[0,1].map(t=>'<tr><td>'+esc(m.teams[t].name)+'</td><td>'+c(t,'attack')+'</td><td>'+c(t,'block')+'</td><td>'+c(t,'serve')+'</td><td>'+c(t,'error')+'</td></tr>').join('')+'</table></div>'+
  '<h3>Maiores pontuadores</h3><div class="tw"><table><tr><th>#</th><th>Jogador</th><th>Equipe</th><th>Pontos</th></tr>'+(top.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.p)+'</td><td>'+esc(m.teams[x.t].name)+'</td><td><b>'+tot(x)+'</b></td></tr>').join('')||'<tr><td colspan="4" class="mut">Nenhum ponto com jogador identificado.</td></tr>')+'</table></div>'+
  '<h3>Jogadores</h3><div class="tw"><table><tr><th>Jogador</th><th>Equipe</th><th>Atq</th><th>Blq</th><th>Saq</th><th>Líb.</th><th>Total</th><th>Erros</th></tr>'+(Object.values(pl).map(x=>'<tr><td>'+esc(x.p)+'</td><td>'+esc(m.teams[x.t].name)+'</td><td>'+x.attack+'</td><td>'+x.block+'</td><td>'+x.serve+'</td><td>'+x.lib+'</td><td><b>'+tot(x)+'</b></td><td>'+x.x+'</td></tr>').join('')||'<tr><td colspan="8" class="mut">Nenhum jogador identificado.</td></tr>')+'</table></div>'+
  
  [['to','Tempos técnicos'],['sub','Substituições'],['note','Observações']].map(([k,n])=>{const l=m.events.filter(e=>e.type===k);return '<h3>'+n+' ('+l.length+')</h3>'+(l.length?'<ul>'+l.map(e=>'<li>'+hm(e.t)+' · Set '+e.set+' ('+e.sc[0]+'–'+e.sc[1]+') · '+evText(e,m)+'</li>').join('')+'</ul>':'<p class="mut">Nenhum registro.</p>')}).join('')+'</div>';
}
/* ---- Formulário compartilhado: nova partida e edição ---- */
const POS6=['Levantador','Ponteiro (rede2)','Central','Oposto','Ponteiro (rede3)','Líbero'],POS7=['Levantador','Ponteiro (rede2)','Central','Oposto','Ponteiro (rede3)','Central','Líbero'];
/* paletas: só trocam as cores das equipes/destaques (--a, --b) */
const PAL={'':['#2563eb','#ea580c','Quadra'],ocean:['#0ea5e9','#f43f5e','Oceano'],forest:['#10b981','#d97706','Floresta'],violet:['#8b5cf6','#14b8a6','Violeta']};
const setPal=k=>{if(k)document.documentElement.dataset.p=k;else delete document.documentElement.dataset.p;try{localStorage.setItem('setpoint:pal',k)}catch(e){}};
try{setPal(localStorage.getItem('setpoint:pal')||'')}catch(e){}
const pal=()=>'<div class="pal"><span class="mut">Cores:</span>'+Object.entries(PAL).map(([k,v])=>'<button class="sw'+((document.documentElement.dataset.p||'')===k?' on':'')+'" title="'+v[2]+'" style="--c1:'+v[0]+';--c2:'+v[1]+'" data-a="pal" data-k="'+k+'"></button>').join('')+'</div>';
/* tempos técnicos: limite por equipe por set (rules.to; 0 = sem tempos) */
const toBtn=(m,s,i)=>{const L=m.rules.to==null?99:m.rules.to;if(!L)return'';const u=m.events.filter(e=>e.type==='to'&&e.team===i&&e.set===s.no).length;return '<button data-a="to" data-t="'+i+'"'+(s.done||u>=L?' disabled':'')+'>Tempo'+(L<99?' '+u+'/'+L:'')+'</button>'};
const defRows=mode=>(mode===7?POS7:POS6).map((name,i)=>({n:String(i+1),name,l:name==='Líbero'}));
const row=(p,i)=>'<div class="prow"'+(i==null?'':' data-i="'+i+'"')+'><input class="rn" inputmode="numeric" placeholder="Nº" value="'+esc(p.n)+'"><input class="rm" placeholder="Nome" value="'+esc(p.name)+'"><label class="lc"><input type="checkbox" class="rl"'+(p.l?' checked':'')+'> Líb.</label><button type="button" data-a="prm">✕</button></div>';
const rosterBox=k=>'<div><label>Jogadores — equipe '+k.toUpperCase()+'</label><div id="r'+k+'"></div><button type="button" data-a="padd" data-k="'+k+'" style="width:100%;margin-top:6px">+ Jogador</button></div>';
const fillRows=(k,ps)=>{$('#r'+k).innerHTML=ps.map((p,i)=>row(p,i)).join('')};
const rd=k=>[...document.querySelectorAll('#r'+k+' .prow')].map(r=>({i:r.dataset.i,n:r.querySelector('.rn').value.trim(),name:r.querySelector('.rm').value.trim(),l:r.querySelector('.rl').checked})).filter(p=>p.n||p.name).map(p=>({...p,name:p.name||'Jogador '+p.n}));
const clean=a=>a.map(({n,name,l})=>({n,name,l}));
const readRules=()=>{const g=id=>Math.max(1,parseInt($(id).value)||1),sw=g('#f_sw'),pts=g('#f_pts');return{setsToWin:sw,pts,diff:g('#f_df'),decPts:sw>1?g('#f_dp'):pts,libServe:$('#f_mode').value==='6',to:+$('#f_to').value}};
function syncDp(){const w=$('#dpw');if(w)w.style.display=(parseInt($('#f_sw').value)||1)<=1?'none':''}
function resetDefaults(){if(view!=='setup')return;const ok=new Set([...POS6,...POS7,'']);if(['a','b'].every(k=>rd(k).every(p=>ok.has(p.name)))){const d=defRows(+$('#f_mode').value);['a','b'].forEach(k=>fillRows(k,d))}}
function initForm(){
  const m=view==='edit'?cur:null,r=m&&m.rules;
  $('#f_name').value=m?m.name:'';$('#f_ta').value=m?m.teams[0].name:'Equipe A';$('#f_tb').value=m?m.teams[1].name:'Equipe B';
  if(r){$('#f_sw').value=r.setsToWin;$('#f_pts').value=r.pts;$('#f_df').value=r.diff;$('#f_dp').value=r.decPts;$('#f_pre').value='c'}
  $('#f_mode').value=r?(r.libServe?'6':'7'):'6';$('#f_to').value=r&&r.to!=null?String(r.to):'2';
  ['a','b'].forEach((k,i)=>fillRows(k,m?m.teams[i].players:defRows(6)));syncDp();
}
const editView=()=>setup().replace('Nova partida','Editar partida').replace('data-a="home">Voltar','data-a="back">Voltar').replace('data-a="create">Iniciar partida','data-a="saveedit">Salvar alterações');
let wl=null;const keepAwake=async()=>{try{if(view==='live'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){}};
document.addEventListener('visibilitychange',keepAwake);
function render(){$('#app').innerHTML={home,setup,live,report,edit:editView}[view]();if(view==='setup'||view==='edit')initForm();keepAwake()}
const go=v=>{closeM();view=v;render();window.scrollTo(0,0)};

/* ---- Fluxo de ponto: equipe → fundamento → jogador ---- */
function openSkill(){openM('<h3>'+esc(cur.teams[flow.team].name)+': como foi o ponto?</h3><div class="grid">'+Object.keys(SK).map(k=>'<button class="big" data-a="sk" data-k="'+k+'">'+SK[k]+'</button>').join('')+'</div>')}
function openPlayers(){
  const err=flow.skill==='error',t=err?1-flow.team:flow.team;
  openM('<h3>'+(err?'Quem errou? ('+esc(cur.teams[t].name)+')':'Quem fez o ponto?')+'</h3><div class="grid">'+roster(t,flow.skill).map(p=>'<button class="big" data-a="pl" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'<button class="big" data-a="pl" data-p="">Não identificar</button></div>');
}
function openLib(L){openM('<h3>Líbero participou da jogada?</h3><div class="grid">'+L.map(p=>'<button class="big" data-a="lb" data-p="'+esc(p)+'">'+esc(p)+'</button>').join('')+'<button class="big" data-a="lb" data-p="">Não</button></div>')}
function endModal(){const s=replay(cur),w=s.w[0]>s.w[1]?0:1;openM('<h3>Partida encerrada</h3><p><b>'+esc(cur.teams[w].name)+'</b> venceu por '+s.w[w]+' sets a '+s.w[1-w]+'.<br>Duração: '+dur(elapsed(s))+'</p><div class="grid"><button class="big pri" data-a="restart">Reiniciar</button><button class="big" data-a="rep" data-id="'+cur.id+'">Ver súmula</button><button class="big" data-a="home">Tela inicial</button><button class="big" data-a="close2">Fechar</button></div><p class="mut">Reiniciar começa outra partida com as mesmas equipes, jogadores e regras. Esta continua salva na tela inicial.</p>')}
function commit(p,lib){const was=replay(cur).done;
  if(flow.edit){const e=cur.events.find(x=>x.id===flow.edit);if(e){e.skill=flow.skill;e.p=p;e.lib=lib||''}}
  else cur.events.push({id:uid(),type:'point',team:flow.team,skill:flow.skill,p,lib:lib||'',t:Date.now()});
  save();closeM();render();if(!was&&replay(cur).done)endModal();
}
const add=e=>{cur.events.push({id:uid(),t:Date.now(),...e});save();closeM();render()};

/* ---- Ações ---- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,d=el.dataset,find=id=>DB.matches.find(x=>x.id===id);
  if(a==='close'){if(ev.target===el)closeM();return}
  if(a==='home'){cur=null;go('home')}
  else if(a==='new')go('setup');
  else if(a==='open'){cur=find(d.id);go('live')}
  else if(a==='rep'){cur=find(d.id);flow.from=view;go('report')}
  else if(a==='back')go('live');
  else if(a==='editm'){if(d.id)cur=find(d.id);go('edit')}
  else if(a==='padd')$('#r'+d.k).insertAdjacentHTML('beforeend',row({n:'',name:'',l:false}));
  else if(a==='prm')el.closest('.prow').remove();
  else if(a==='saveedit'){
    /* renomear jogador: reescreve o nome nos eventos já registrados da mesma equipe */
    const map=[{},{}];
    [0,1].forEach(t=>{const old=cur.teams[t].players,nw=rd(t?'b':'a');
      nw.forEach(p=>{if(p.i!=null&&old[p.i]&&lbl(old[p.i])!==lbl(p))map[t][lbl(old[p.i])]=lbl(p)});
      cur.teams[t]={name:$(t?'#f_tb':'#f_ta').value.trim()||'Equipe '+'AB'[t],players:clean(nw)}});
    cur.events.forEach(e=>['p','lib','out','in'].forEach(k=>{const mp=map[k==='p'&&e.skill==='error'?1-e.team:e.team];if(mp&&mp[e[k]])e[k]=mp[e[k]]}));
    cur.name=$('#f_name').value.trim()||cur.name;cur.rules=readRules();save();go('live')}
  else if(a==='restart'){const o=cur,m={id:uid(),created:Date.now(),name:o.name,teams:JSON.parse(JSON.stringify(o.teams)),rules:{...o.rules},events:[]};DB.matches.push(m);save();cur=m;go('live')}
  else if(a==='print')window.print();
  else if(a==='rm'){flow.rm=d.id;openM('<h3>Excluir partida?</h3><p>Esta ação não pode ser desfeita.</p><div class="row"><button data-a="rmok" class="dn">Excluir</button><button data-a="close2">Cancelar</button></div>')}
  else if(a==='rmok'){DB.matches=DB.matches.filter(x=>x.id!==flow.rm);save();closeM();render()}
  else if(a==='close2')closeM();
  else if(a==='create'){
    const n=id=>Math.max(1,parseInt($(id).value)||1),
    pp=id=>$(id).value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const lb=/\((l|líbero|libero)\)/i.test(l);l=l.replace(/\s*\((l|líbero|libero)\)/i,'').trim();const x=l.match(/^#?(\d+)\s*[-.–]?\s*(.*)$/);return x?{n:x[1],name:x[2]||'Jogador '+x[1],l:lb}:{n:'',name:l,l:lb}});
    const m={id:uid(),created:Date.now(),name:$('#f_name').value.trim()||'Partida '+new Date().toLocaleDateString('pt-BR'),
      teams:[{name:$('#f_ta').value.trim()||'Equipe A',players:clean(rd('a'))},{name:$('#f_tb').value.trim()||'Equipe B',players:clean(rd('b'))}],
      rules:readRules(),events:[]};
    DB.matches.push(m);save();cur=m;go('live');
  }
  else if(a==='pt'){flow={team:+d.t};openSkill()}
  else if(a==='sk'){flow.skill=d.k;openPlayers()}
  else if(a==='pl'){flow.p=d.p;const L=flow.skill==='error'?libs(flow.team):[];if(L.length)openLib(L);else commit(d.p,'')}
  else if(a==='lb')commit(flow.p,d.p);
  else if(a==='edit'){const e=cur.events.find(x=>x.id===d.id);flow={team:e.team,edit:e.id};openSkill()}
  else if(a==='del'){cur.events=cur.events.filter(x=>x.id!==d.id);save();render()}
  else if(a==='undo'){cur.events.pop();save();render()}
  else if(a==='to'){if(!replay(cur).done)add({type:'to',team:+d.t})}
  else if(a==='pal'){setPal(d.k);render()}
  else if(a==='exp'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='setpoint-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='imp')$('#impf').click();
  else if(a==='sub'){flow={team:+d.t};openM('<h3>Substituição — '+esc(cur.teams[+d.t].name)+'</h3><datalist id="dl">'+roster(+d.t).map(p=>'<option value="'+esc(p)+'">').join('')+'</datalist><label>Sai</label><input id="so" list="dl" placeholder="Nº ou nome"><label>Entra</label><input id="si" list="dl" placeholder="Nº ou nome"><button class="big pri" style="margin-top:12px" data-a="subok">Registrar</button>')}
  else if(a==='subok')add({type:'sub',team:flow.team,out:$('#so').value.trim(),in:$('#si').value.trim()});
  else if(a==='note')openM('<h3>Observação</h3><textarea id="nt" placeholder="Ex.: atleta com dor no joelho"></textarea><button class="big pri" style="margin-top:12px" data-a="noteok">Salvar</button>');
  else if(a==='noteok'){const t=$('#nt').value.trim();if(t)add({type:'note',text:t});else closeM()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='f_pre'||e.target.value==='c')return;
  const [s,p,d,x]=e.target.value.split(',');$('#f_sw').value=s;$('#f_pts').value=p;$('#f_df').value=d;$('#f_dp').value=x;
});
document.addEventListener('input',e=>{if(e.target.id==='f_sw')syncDp()});
document.addEventListener('change',e=>{if(e.target.id==='f_pre')syncDp();if(e.target.id==='f_mode')resetDefaults()});
/* importar backup: soma partidas novas (mesmo id não duplica) */
document.addEventListener('change',e=>{if(e.target.id!=='impf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.matches))throw 0;let n=0;j.matches.forEach(m=>{if(m&&m.id&&m.teams&&m.rules&&Array.isArray(m.events)&&!DB.matches.some(x=>x.id===m.id)){DB.matches.push(m);n++}});save();render();openM('<h3>Backup importado</h3><p>'+n+' partida(s) adicionada(s).</p><button class="big pri" data-a="close2">OK</button>')}catch(x){openM('<h3>Arquivo inválido</h3><p>Escolha um backup exportado pelo SETPOINT.</p><button class="big" data-a="close2">Fechar</button>')}};r.readAsText(e.target.files[0])});
setInterval(()=>{const c=$('#clk');if(c&&view==='live')c.textContent=dur(elapsed(replay(cur)))},1000);
render();
/* PWA: service worker + pedido de armazenamento persistente */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
