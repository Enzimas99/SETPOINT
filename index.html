<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#111827;--mut:#64748b;--bd:#dbe1ea;--a:#1d4ed8;--b:#dc2626;--ok:#16a34a;--dn:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#93a0c0;--bd:#26304f;--a:#5b8dff;--b:#ff5a5a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#93a0c0;--bd:#26304f;--a:#5b8dff;--b:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
#app{max-width:980px;margin:0 auto;padding:12px}
h1{margin:0;font-size:28px;letter-spacing:2px}h1 b{color:var(--a)}h2,h3{margin:.3em 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
button{cursor:pointer;font-weight:600}button:active{transform:scale(.97)}button:disabled{opacity:.4}
button.pri{background:var(--a);color:#fff;border-color:var(--a)}button.dn{color:var(--dn)}
button.big{width:100%;padding:18px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
form,.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,textarea,select{width:100%}textarea{min-height:110px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.live{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:12px;text-align:center}
.t0{border-color:var(--a)}.t1{border-color:var(--b)}
.side h2{font-size:clamp(15px,4vw,24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-size:clamp(80px,26vw,200px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.t0 .sc{color:var(--a)}.t1 .sc{color:var(--b)}
.pt0{background:var(--a);color:#fff;border-color:var(--a);margin:10px 0 8px;min-height:84px}
.pt1{background:var(--b);color:#fff;border-color:var(--b);margin:10px 0 8px;min-height:84px}
.side .row button{flex:1;padding:12px 6px}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.bar button{flex:1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;margin:2px;font-size:13px}
.ban{background:var(--ok);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:700;margin:10px 0}
.log{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}
.log button{padding:4px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9;padding:12px}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:20px;padding:16px calc(16px) calc(16px + env(safe-area-inset-bottom,0px))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left}
.tw{overflow-x:auto}
.hero{background:linear-gradient(135deg,var(--a) 0%,var(--a) 65%,var(--b) 100%);color:#fff;border-radius:22px;padding:22px 18px;margin-bottom:14px}.hero h1{color:#fff;font-size:36px}.hero h1 b{opacity:.8;color:#fff}.hero p{margin:6px 0 16px;opacity:.92}.hero button{background:#fff;color:#111;border:0}.hero button.ghost{background:transparent;color:#fff;border:2px solid #fff;margin-top:8px}
@media(max-width:520px){.pk{grid-template-columns:1fr}}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}.mt{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--bd);white-space:nowrap}.pill.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.res{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;gap:8px;margin:10px 0}.res .n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.res .s{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.mc .row button{flex:1;padding:10px 8px}
#warn:not(:empty){position:fixed;top:0;left:0;right:0;z-index:20;background:var(--dn);color:#fff;padding:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));text-align:center;font-weight:700;font-size:14px}
.rg{display:grid;gap:14px}.prow{display:grid;grid-template-columns:60px 1fr auto auto auto;gap:6px;margin:6px 0;align-items:center}.prow button{padding:8px 12px}.prow .lc{display:flex;gap:4px;align-items:center;margin:0;font-size:13px;white-space:nowrap}.prow input[type=checkbox]{width:auto}
@media(min-width:700px){.sheet{border-radius:20px;align-self:center}.rg{grid-template-columns:1fr 1fr}}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.box,.card{border:1px solid #999}#app{max-width:none}}
</style></head><body>
<div id="warn"></div><div id="app"></div><div id="modal"></div>
<script>
/* ============ SETPOINT v0.1 ============
 Arquitetura: o estado de uma partida é um REGISTRO DE EVENTOS (match.events).
 Placar, sets e vencedor são sempre CALCULADOS por replay(). Isso torna
 desfazer/corrigir triviais e prepara estatísticas, rotação e líbero (novos tipos de evento).
 Camadas: Store (localStorage) → Regras (replay) → Views (HTML) → Ações (eventos de clique). */

/* ---- Store: trocar por API/banco depois sem mexer nas views ---- */
const KEY='setpoint:v1';let DB={matches:[]},cur=null,view='home',flow={};
/* se o JSON local estiver corrompido, guarda uma cópia antes de qualquer novo salvamento */
try{const raw=localStorage.getItem(KEY);if(raw)try{DB=JSON.parse(raw)||DB}catch(e){try{localStorage.setItem(KEY+':corrompido',raw)}catch(_){}document.getElementById('warn').textContent='⚠ Dados locais ilegíveis: uma cópia foi guardada. Importe um backup.'}}catch(e){}
if(!Array.isArray(DB.matches))DB.matches=[];
if(!Array.isArray(DB.teams))DB.teams=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB));$('#warn').textContent='';return true}catch(e){$('#warn').textContent='⚠ Não foi possível salvar neste aparelho (memória cheia ou modo privado). Exporte um backup agora.';return false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
/* migração: descarta registros inválidos e converte o antigo m.ended em evento 'end' */
DB.matches=DB.matches.filter(m=>m&&m.teams&&m.rules&&Array.isArray(m.events));
DB.matches.forEach(m=>{if(m.ended){m.events.push({id:uid(),type:'end',t:m.ended});delete m.ended}});
DB.teams=DB.teams.filter(t=>t&&t.id&&Array.isArray(t.players));
try{localStorage.removeItem('setpoint:pal')}catch(e){}
const SK={attack:'Ataque',block:'Bloqueio',serve:'Saque',error:'Erro adversário'};
const hm=t=>new Date(t).toLocaleTimeString('pt-BR');
const dur=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(s)};
/* cronômetro: começa no 1º ponto e para no ponto final (calculado, então desfazer reabre o relógio) */
const elapsed=s=>s.start?(s.done?s.end:Date.now())-s.start:0;

/* ---- Regras ---- */
const target=(m,no)=>{const r=m.rules,tot=r.setsToWin*2-1;return(no===tot&&tot>1)?r.decPts:r.pts};
function replay(m){
  const r=m.rules;let sc=[0,0],no=1,w=[0,0],sets=[],done=false,start=null,end=null,manual=false;
  for(const e of m.events){
    e.set=no;
    if(e.type==='point'){
      if(start===null)start=e.t;sc[e.team]++;e.sc=[...sc];
      if(Math.max(...sc)>=target(m,no)&&Math.abs(sc[0]-sc[1])>=r.diff){
        const t=sc[0]>sc[1]?0:1;w[t]++;sets.push({no,sc:[...sc],w:t});sc=[0,0];no++;
        if(w[t]>=r.setsToWin){done=true;end=e.t}
      }
    }else{e.sc=[...sc];if(e.type==='end'&&!done){done=true;manual=true;end=e.t}}
  }
  return{sc,no,w,sets,done,start,end,manual};
}
const evText=(e,m)=>{const T=i=>esc(m.teams[i].name);
  if(e.type==='point')return e.skill==='error'?T(e.team)+': erro adversário'+(e.p?' ('+esc(e.p)+')':'')+(e.lib?' · líbero: '+esc(e.lib):''):T(e.team)+': '+SK[e.skill]+(e.p?' — '+esc(e.p):'');
  if(e.type==='to')return 'Tempo técnico — '+T(e.team);
  if(e.type==='sub')return (e.kind==='libero'?'Troca de líbero ':'Substituição ')+T(e.team)+': sai '+esc(e.out||'?')+', entra '+esc(e.in||'?');
  return e.type==='end'?'Partida encerrada manualmente':'Obs: '+esc(e.text)};

/* ---- Modal ---- */
const openM=h=>{$('#modal').innerHTML='<div class="ov" data-a="close"><div class="sheet">'+h+'</div></div>'};
const closeM=()=>{$('#modal').innerHTML=''};
/* líbero (p.l): não aparece em saque nem bloqueio */
const lbl=p=>(p.n?'#'+p.n+' ':'')+p.name+(p.l?' (L)':'');
/* ---- Escalação: titulares (p.s) + substituições do registro de eventos ---- */
function starters(m,t){const P=m.teams[t].players;if(P.some(p=>p.s!==undefined))return P.filter(p=>p.s).map(lbl);return P.filter(p=>m.rules.libServe||!p.l).slice(0,6).map(lbl)}
function lineup(m,t){let court=starters(m,t);for(const e of m.events)if(e.type==='sub'&&e.team===t)court=court.map(x=>x===e.out?e.in:x);return{court,bench:m.teams[t].players.map(lbl).filter(x=>!court.includes(x))}}
const withS=(m,t)=>{const st=starters(m,t);return m.teams[t].players.map(p=>({...p,s:st.includes(lbl(p))}))};
const courtShort=(m,t)=>lineup(m,t).court.map(x=>(x.match(/^#\S+/)||[x])[0]).join(' ');
/* regras do líbero: nunca bloqueia; só saca se a formação for de 6 (líbero saca). all=true ignora quem está em quadra (edição de registros) */
const roster=(i,skill,all)=>{const on=all?null:lineup(cur,i).court;return cur.teams[i].players.filter(p=>!(p.l&&(skill==='block'||(skill==='serve'&&!cur.rules.libServe)))).map(lbl).filter(x=>!on||on.includes(x))};

/* ---- Views ---- */
function home(){
  const ms=[...DB.matches].reverse();
  return '<div class="hero"><h1>SET<b>POINT</b></h1><p>Súmula digital de vôlei — rápida, simples e pronta para a quadra.</p>'+
  '<button class="big" data-a="new">+ Nova partida</button><button class="big ghost" data-a="teams">Criar e/ou adicionar equipes</button></div><h3>Partidas</h3>'+
  (ms.length?ms.map(m=>{const s=replay(m);return '<div class="mc"><div class="mt"><b>'+esc(m.name)+'</b><span class="pill'+(s.done?'':' on')+'">'+(s.done?'Encerrada':'Em andamento')+'</span></div><div class="res"><span class="n" style="color:var(--a)">'+esc(m.teams[0].name)+'</span><span class="s">'+s.w[0]+' × '+s.w[1]+'</span><span class="n" style="color:var(--b)">'+esc(m.teams[1].name)+'</span></div><div class="mut">'+new Date(m.created).toLocaleString('pt-BR')+'</div><div class="row" style="margin-top:10px"><button data-a="open" data-id="'+m.id+'">'+(s.done?'Abrir':'Continuar')+'</button><button data-a="rep" data-id="'+m.id+'">Súmula</button><button data-a="editm" data-id="'+m.id+'">Editar</button><button class="dn" data-a="rm" data-id="'+m.id+'">Excluir</button></div></div>'}).join(''):'<p class="mut">Nenhuma partida ainda. Crie a primeira para começar.</p>')+
  '<div class="row" style="margin-top:12px"><button style="flex:1" data-a="exp">Exportar backup</button><button style="flex:1" data-a="imp">Importar backup</button></div><input type="file" id="impf" accept="application/json,.json" hidden><p class="mut" style="text-align:center">Dados salvos neste aparelho. Faça backup de vez em quando. · v1.4.0</p>';
}
function setup(){
  return '<div class="top"><h1>Nova partida</h1><button data-a="home">Voltar</button></div><form onsubmit="return false">'+
  '<label>Nome / identificação</label><input id="f_name" placeholder="Ex.: Treino ACM Osasco — 02/11">'+
  (view==='edit'?'<div class="g2"><div><label>Equipe A</label><input id="f_ta"></div><div><label>Equipe B</label><input id="f_tb"></div></div>':teamPick())+
  (view==='edit'?'<div class="rg">'+rosterBox('a')+rosterBox('b')+'</div><p class="mut">Estas alterações valem só para esta partida; a equipe salva não muda.</p>':'')+
  '<label>Regras</label><select id="f_pre"><option value="3,25,2,15">Melhor de 5</option><option value="2,25,2,15">Melhor de 3</option><option value="1,15,2,15">Set único (15 pts)</option><option value="c">Personalizada</option></select>'+
  '<div class="g4"><div><label>Sets p/ vencer</label><input id="f_sw" type="number" min="1" value="3"></div><div><label>Pontos do set</label><input id="f_pts" type="number" min="1" value="25"></div><div><label>Dif. mínima</label><input id="f_df" type="number" min="1" value="2"></div><div id="dpw"><label>Pts decisivo</label><input id="f_dp" type="number" min="1" value="15"></div></div>'+
  '<label>Formação</label><select id="f_mode"><option value="6">6 Jogadores - Líbero Saca</option><option value="7">7 Jogadores - Líbero não saca</option></select>'+'<label>Tempos técnicos (por equipe, por set)</label><select id="f_to"><option value="0">Sem tempos</option><option value="1">1 tempo</option><option value="2" selected>2 tempos</option><option value="3">3 tempos</option></select>'+'<p class="mut">Sets para vencer: 3 = melhor de 5. O set decisivo usa pontuação própria (o campo some quando basta 1 set).</p>'+
  '<button class="big pri" data-a="create">Iniciar partida</button></form>';
}
function live(){
  const m=cur,s=replay(m),shown=s.done&&!s.manual?s.sets[s.sets.length-1].sc:s.sc;
  const side=i=>'<section class="side t'+i+'"><h2>'+esc(m.teams[i].name)+'</h2><div class="sc">'+shown[i]+'</div><div class="mut">Sets: <b>'+s.w[i]+'</b></div><div class="mut" style="font-size:12px">Em quadra: '+courtShort(m,i)+'</div><button class="big pt'+i+'" data-a="pt" data-t="'+i+'"'+(s.done?' disabled':'')+'>+ PONTO</button><div class="row">'+toBtn(m,s,i)+'<button data-a="sub" data-t="'+i+'"'+(s.done?' disabled':'')+'>Subst.</button></div></section>';
  const win=s.w[0]>s.w[1]?0:1;
  return '<div class="top"><button data-a="home">‹ Início</button><div style="text-align:center"><b>'+esc(m.name)+'</b><div class="mut">'+(s.done?'Partida encerrada':'Set '+s.no+' · até '+target(m,s.no)+' (dif. '+m.rules.diff+')')+'</div></div><button data-a="rep" data-id="'+m.id+'">Súmula</button></div>'+
  (s.done?'<div class="ban">'+(s.manual?'Partida encerrada manualmente — sets '+s.w[0]+' × '+s.w[1]+(s.sc[0]||s.sc[1]?' (set interrompido '+s.sc[0]+'–'+s.sc[1]+')':''):'Fim! Vencedor: '+esc(m.teams[win].name)+' ('+s.w[win]+' sets a '+s.w[1-win]+')')+'</div><div class="bar">'+(s.manual?'<button data-a="reopen">Reabrir</button>':'')+'<button class="pri" data-a="restart">Reiniciar partida</button><button data-a="rep" data-id="'+m.id+'">Súmula</button></div>':'')+
  '<div class="mut" style="text-align:center;margin-bottom:6px">⏱ Tempo de jogo: <b id="clk">'+dur(elapsed(s))+'</b></div><div class="live">'+side(0)+side(1)+'</div>'+
  '<div style="text-align:center;margin-top:8px">'+s.sets.map(x=>'<span class="chip">Set '+x.no+': '+x.sc[0]+'–'+x.sc[1]+'</span>').join('')+'</div>'+
  '<div class="bar"><button data-a="undo"'+(m.events.length?'':' disabled')+'>↶ Desfazer</button><button data-a="note">Observação</button><button data-a="editm">Editar</button>'+(s.done?'':'<button class="dn" data-a="endm">Encerrar</button>')+'</div>'+
  '<div class="box"><b>Últimos registros</b>'+(m.events.length?[...m.events].reverse().slice(0,3).map(e=>'<div class="log"><span><span class="mut">S'+e.set+' '+e.sc[0]+'–'+e.sc[1]+'</span> '+evText(e,m)+'</span><span class="row">'+(e.type==='point'?'<button data-a="edit" data-id="'+e.id+'">✎</button>':'')+'<button class="dn" data-a="del" data-id="'+e.id+'">✕</button></span></div>').join(''):'<p class="mut">Nada registrado ainda.</p>')+'</div>';
}
function report(){
  const m=cur,s=replay(m),R=m.rules,win=s.done&&!s.manual?(s.w[0]>s.w[1]?0:1):-1;
  const cnt={};m.events.filter(e=>e.type==='point').forEach(e=>{const c=cnt[e.team]=cnt[e.team]||{attack:0,block:0,serve:0,error:0};c[e.skill]++});
  const pl={},P=(t,p)=>pl[t+'|'+p]=pl[t+'|'+p]||{t,p,attack:0,block:0,serve:0,lib:0,x:0};
  m.events.filter(e=>e.type==='point').forEach(e=>{if(e.p){const t=e.skill==='error'?1-e.team:e.team,o=P(t,e.p);if(e.skill==='error')o.x++;else o[e.skill]++}if(e.lib)P(e.team,e.lib).lib++});
  const tot=x=>x.attack+x.block+x.serve+x.lib,top=Object.values(pl).filter(x=>tot(x)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,5);
  const c=(t,k)=>(cnt[t]||{})[k]||0;
  return '<div class="top noprint"><button data-a="back">‹ Voltar</button><button class="pri" data-a="print">Imprimir / salvar PDF</button></div>'+
  '<div class="box"><h1>SET<b>POINT</b> — Súmula</h1><p><b>'+esc(m.name)+'</b><br>ID '+m.id.toUpperCase()+' · '+new Date(m.created).toLocaleString('pt-BR')+'<br>Duração: '+dur(elapsed(s))+(s.done?'':' (em andamento)')+'<br>Regras: '+(R.setsToWin*2-1)+' sets máx., '+R.pts+' pts (decisivo '+R.decPts+'), diferença mínima '+R.diff+'.</p>'+
  '<h3>Resultado: '+esc(m.teams[0].name)+' '+s.w[0]+' × '+s.w[1]+' '+esc(m.teams[1].name)+'</h3>'+(win>=0?'<p>Vencedor: <b>'+esc(m.teams[win].name)+'</b></p>':'<p class="mut">'+(s.manual?'Partida encerrada manualmente.':'Partida em andamento.')+'</p>')+
  '<div class="tw"><table><tr><th>Set</th><th>'+esc(m.teams[0].name)+'</th><th>'+esc(m.teams[1].name)+'</th></tr>'+s.sets.map(x=>'<tr><td>'+x.no+'</td><td>'+x.sc[0]+'</td><td>'+x.sc[1]+'</td></tr>').join('')+(s.done&&!s.manual?'':'<tr><td>'+s.no+(s.manual?' (interrompido)':' (atual)')+'</td><td>'+s.sc[0]+'</td><td>'+s.sc[1]+'</td></tr>')+'</table></div>'+
  '<h3>Pontos por fundamento</h3><div class="tw"><table><tr><th>Equipe</th><th>Ataque</th><th>Bloqueio</th><th>Saque</th><th>Erro adv.</th></tr>'+[0,1].map(t=>'<tr><td>'+esc(m.teams[t].name)+'</td><td>'+c(t,'attack')+'</td><td>'+c(t,'block')+'</td><td>'+c(t,'serve')+'</td><td>'+c(t,'error')+'</td></tr>').join('')+'</table></div>'+

/* valida as equipes antes de iniciar/salvar: retorna lista de problemas (vazia = ok) */
function validate(names,rows,rules){const err=[],mode=rules.libServe?6:7,need=rules.libServe?6:7;
  if(names[0]&&names[0].trim().toLowerCase()===(names[1]||'').trim().toLowerCase())err.push('As equipes precisam ter nomes diferentes.');
  [0,1].forEach(t=>{const nm=names[t]||'Equipe '+'AB'[t],P=rows[t],seen=new Set(),nums=new Set();
    if(P.length<need)err.push(nm+': cadastre pelo menos '+need+' jogadores'+(rules.libServe?'.':' (6 titulares + líbero).'));
    P.forEach(p=>{const k=lbl(p).toLowerCase();if(seen.has(k))err.push(nm+': jogador repetido ('+lbl(p)+').');seen.add(k);if(p.n){if(nums.has(p.n))err.push(nm+': o número '+p.n+' está em mais de um jogador.');nums.add(p.n)}});
    if(P.filter(p=>p.l).length>maxLib(P.length,mode))err.push(nm+': líberos demais para a quantidade de jogadores.');
    const s=P.filter(p=>p.s).length;if(s!==6)err.push(nm+': marque exatamente 6 jogadores em quadra (Tit.). Agora há '+s+'.')});
  return[...new Set(err)]}

  else if(a==='undo'){cur.events.pop();save();render()}
  else if(a==='to'){if(!replay(cur).done)add({type:'to',team:+d.t})}
  else if(a==='exp'){const b=new Blob([JSON.stringify(DB)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='setpoint-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='imp')$('#impf').click();
  else if(a==='sub'){const t=+d.t,L=lineup(cur,t);
    if(!L.bench.length){openM('<h3>Sem reservas</h3><p>Não há jogadores no banco desta equipe. Adicione jogadores em Editar.</p><button class="big" data-a="close2">Fechar</button>');return}
    flow={team:t};const op=l=>l.map(x=>'<option>'+esc(x)+'</option>').join('');
    openM('<h3>Substituição — '+esc(cur.teams[t].name)+'</h3><label>Sai da quadra</label><select id="so">'+op(L.court)+'</select><label>Entra</label><select id="si">'+op(L.bench)+'</select><button class="big pri" style="margin-top:12px" data-a="subok">Registrar</button>')}
  else if(a==='subok'){const o=$('#so').value,i=$('#si').value,P=cur.teams[flow.team].players,lib=x=>P.some(p=>lbl(p)===x&&p.l);add({type:'sub',team:flow.team,out:o,in:i,kind:lib(o)||lib(i)?'libero':'normal'})}
  else if(a==='note')openM('<h3>Observação</h3><textarea id="nt" placeholder="Ex.: atleta com dor no joelho"></textarea><button class="big pri" style="margin-top:12px" data-a="noteok">Salvar</button>');
  else if(a==='noteok'){const t=$('#nt').value.trim();if(t)add({type:'note',text:t});else closeM()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='f_pre'||e.target.value==='c')return;
  const [s,p,d,x]=e.target.value.split(',');$('#f_sw').value=s;$('#f_pts').value=p;$('#f_df').value=d;$('#f_dp').value=x;
});
document.addEventListener('input',e=>{if(e.target.id==='f_sw')syncDp()});
document.addEventListener('change',e=>{if(e.target.id==='s_ta'||e.target.id==='s_tb'){if(e.target.value==='__new'){flow.draft=draft();ED={id:null,back:'setup',side:e.target.id==='s_ta'?'a':'b'};go('team')}else updatePick()}if(e.target.id==='f_pre')syncDp();if(e.target.id==='f_mode')resetDefaults();if(e.target.id==='f_mode'||e.target.classList.contains('rl'))syncLib()});
/* importar backup: soma partidas novas (mesmo id não duplica) */
document.addEventListener('change',e=>{if(e.target.id!=='impf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.matches))throw 0;let n=0;j.matches.forEach(m=>{if(m&&m.id&&m.teams&&m.rules&&Array.isArray(m.events)&&!DB.matches.some(x=>x.id===m.id)){DB.matches.push(m);n++}});(Array.isArray(j.teams)?j.teams:[]).forEach(t=>{if(t&&t.id&&t.name&&Array.isArray(t.players)&&!DB.teams.some(x=>x.id===t.id))DB.teams.push(t)});save();render();openM('<h3>Backup importado</h3><p>'+n+' partida(s) adicionada(s).</p><button class="big pri" data-a="close2">OK</button>')}catch(x){openM('<h3>Arquivo inválido</h3><p>Escolha um backup exportado pelo SETPOINT.</p><button class="big" data-a="close2">Fechar</button>')}};r.readAsText(e.target.files[0])});
setInterval(()=>{const c=$('#clk');if(c&&view==='live')c.textContent=dur(elapsed(replay(cur)))},1000);
render();
/* PWA: service worker + pedido de armazenamento persistente */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
