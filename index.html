<div id="warn"></div><div id="app"></div><div id="modal"></div><div id="sync"></div>
<script src="config.js"></script>
<script>
/* ============ SETPOINT v0.1 ============
 Arquitetura: o estado de uma partida é um REGISTRO DE EVENTOS (match.events).
 Placar, sets e vencedor são sempre CALCULADOS por replay(). Isso torna
 desfazer/corrigir triviais e prepara estatísticas, rotação e líbero (novos tipos de evento).
 Camadas: Store (localStorage) → Regras (replay) → Views (HTML) → Ações (eventos de clique). */

/* ---- Store: trocar por API/banco depois sem mexer nas views ---- */
const GUEST_KEY='setpoint:v1';
let SES=null;try{SES=JSON.parse(localStorage.getItem('setpoint:auth'))}catch(e){}
if(!(SES&&SES.user&&SES.refresh_token))SES=null;
let KEY=SES?'setpoint:u:'+SES.user.id:GUEST_KEY,cur=null,view='home',flow={};
function uid(){return Math.random().toString(36).slice(2,9)}
/* ---- Modelo 5x1 ----
 jogador: {n, name, fn:'lev|opo|pon|cen|lib', s:true se titular, pos:1-6 (so titular), l:true se libero}
 Categorias exclusivas: titular | libero | reserva. */
const FN={lev:'Levantador',opo:'Oposto',pon:'Ponteiro',cen:'Central'},FNS={lev:'Levant.',opo:'Oposto',pon:'Pont.',cen:'Central'},FNP={lev:'levantador(es)',opo:'oposto(s)',pon:'ponteiro(s)',cen:'central(is)'},NEED={lev:1,opo:1,pon:2,cen:2},PAT=['lev','pon','cen','opo','pon','cen'];
const guessFn=n=>{const s=String(n||'').toLowerCase();return/levant/.test(s)?'lev':/opost/.test(s)?'opo':/ponteir/.test(s)?'pon':/central|meio/.test(s)?'cen':null};
/* converte jogadores do formato antigo (sem funcao/posicao): 6 titulares em P1..P6 pela ordem, liberos separados, o resto vira reserva */
function upgradePlayers(P){
  if(P.every(p=>p.fn))return P.map(p=>({...p}));
  const Q=P.map(p=>({...p}));
  let tit=Q.filter(p=>p.s&&!p.l);if(!Q.some(p=>p.s!==undefined))tit=Q.filter(p=>!p.l);
  tit=tit.slice(0,6);
  Q.forEach(p=>{const i=tit.indexOf(p);if(p.fn)return;
    if(p.l){p.fn='lib';p.s=false;delete p.pos}
    else if(i>=0){p.s=true;p.pos=i+1;p.fn=guessFn(p.name)||PAT[i]}
    else{p.s=false;delete p.pos;p.fn=guessFn(p.name)||'pon'}});
  return Q}
/* carrega o armazenamento local de uma chave (sem conta ou de uma conta) e normaliza os registros */
function loadDB(key){
  let d={matches:[],teams:[]};
  try{const raw=localStorage.getItem(key);if(raw)try{d=JSON.parse(raw)||d}catch(e){try{localStorage.setItem(key+':corrompido',raw)}catch(_){}document.getElementById('warn').textContent='⚠ Dados locais ilegíveis: uma cópia foi guardada. Importe um backup.'}}catch(e){}
  if(!Array.isArray(d.matches))d.matches=[];if(!Array.isArray(d.teams))d.teams=[];
  const s=d.sync=d.sync||{};s.dirty=s.dirty||{};s.dirty.matches=s.dirty.matches||{};s.dirty.teams=s.dirty.teams||{};s.del=s.del||[];s.last=s.last||{};
  d.matches=d.matches.filter(m=>m&&m.id&&m.teams&&m.rules&&Array.isArray(m.events));
  d.matches.forEach(m=>{if(m.ended){m.events.push({id:uid(),type:'end',t:m.ended});delete m.ended}});
  d.teams=d.teams.filter(t=>t&&t.id&&Array.isArray(t.players));
  d.teams.forEach(t=>{if(!t.players.every(p=>p.fn)){t.players=upgradePlayers(t.players);t.u=Date.now();s.dirty.teams[t.id]=1}});
  return d}
let DB=loadDB(KEY);
function save(){try{track();localStorage.setItem(KEY,JSON.stringify(DB));$('#warn').textContent='';schedSync();return true}catch(e){$('#warn').textContent='⚠ Não foi possível salvar neste aparelho (memória cheia ou modo privado). Exporte um backup agora.';return false}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* migração: descarta registros inválidos e converte o antigo m.ended em evento 'end' */
try{localStorage.removeItem('setpoint:pal')}catch(e){}
const SK={attack:'Ataque',block:'Bloqueio',serve:'Saque',error:'Erro adversário'};
const hm=t=>new Date(t).toLocaleTimeString('pt-BR');
const dur=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(s)};
/* cronômetro: começa no 1º ponto e para no ponto final (calculado, então desfazer reabre o relógio) */
const elapsed=s=>s.start?(s.done?s.end:Date.now())-s.start:0;

/* ---- Regras ---- */
const target=(m,no)=>{const r=m.rules,tot=r.setsToWin*2-1;return(no===tot&&tot>1)?r.decPts:r.pts};
/* ---- Rodizio 5x1 ----
 A memoria do rodizio e CALCULADA pelo replay do historico (como o placar): por isso desfazer/editar nunca a desincroniza.
 slots[time][0..5] = P1..P6, cada um {t: titular da posicao (memoria do rodizio), on: quem esta em quadra (t ou libero)}.
 Quem saca = titular da P1. Ao ganhar o saque, a equipe gira: P2->P1, P1->P6, P6->P5, P5->P4, P4->P3, P3->P2. Zera a cada set. */
const rotate=a=>[a[1],a[2],a[3],a[4],a[5],a[0]];
const hasRot=m=>m.teams.every((t,i)=>t.players.some(p=>p.pos!==undefined)&&starters(m,i).length===6);
function applySub(sl,e,m){
  const isLib=x=>m.teams[e.team].players.some(p=>lbl(p)===x&&p.l),i=sl.findIndex(s=>s.on===e.out);if(i<0)return;
  sl[i].on=e.in;if(e.kind!=='libero'||!isLib(e.in))sl[i].t=e.in}
function replay(m){
  const r=m.rules;let sc=[0,0],no=1,w=[0,0],sets=[],done=false,start=null,end=null,manual=false;
  const rot0=hasRot(m);let slots=null,serving=0,pts=0;
  const mk=()=>{if(!rot0)return;slots=[0,1].map(t=>starters(m,t).map(x=>({t:x,on:x})));const f=m.firstServe||0;serving=no%2?f:1-f;pts=0};
  mk();
  for(const e of m.events){
    e.set=no;
    if(e.type==='point'){
      if(start===null)start=e.t;sc[e.team]++;e.sc=[...sc];
      if(slots){if(serving!==e.team){slots[e.team]=rotate(slots[e.team]);serving=e.team}e.srv=serving;pts++}
      if(Math.max(...sc)>=target(m,no)&&Math.abs(sc[0]-sc[1])>=r.diff){
        const t=sc[0]>sc[1]?0:1;w[t]++;sets.push({no,sc:[...sc],w:t});sc=[0,0];no++;mk();
        if(w[t]>=r.setsToWin){done=true;end=e.t}
      }
    }else{e.sc=[...sc];if(e.type==='end'&&!done){done=true;manual=true;end=e.t}
      if(slots){if(e.type==='sub')applySub(slots[e.team],e,m);else if(e.type==='first'&&pts===0)serving=e.team}}
  }
  return{sc,no,w,sets,done,start,end,manual,slots,serving,pts};
}
const evText=(e,m)=>{const T=i=>esc(m.teams[i].name);
  if(e.type==='point')return e.skill==='error'?T(e.team)+': erro adversário'+(e.p?' ('+esc(e.p)+')':'')+(e.lib?' · líbero: '+esc(e.lib):''):T(e.team)+': '+SK[e.skill]+(e.p?' — '+esc(e.p):'');
  if(e.type==='to')return 'Tempo técnico — '+T(e.team);
  if(e.type==='sub')return (e.kind==='libero'?'Troca de líbero ':'Substituição ')+T(e.team)+': sai '+esc(e.out||'?')+', entra '+esc(e.in||'?');
  if(e.type==='first')return 'Saque inicial do set: '+T(e.team);
  return e.type==='end'?'Partida encerrada manualmente':'Obs: '+esc(e.text)};

/* ---- Modal ---- */
const openM=h=>{$('#modal').innerHTML='<div class="ov" data-a="close"><div class="sheet">'+h+'</div></div>'};
const closeM=()=>{$('#modal').innerHTML=''};
/* líbero (p.l): não aparece em saque nem bloqueio */
const lbl=p=>(p.n?'#'+p.n+' ':'')+p.name+(p.l?' (L)':'');
/* ---- Escalação: titulares (p.s) + substituições do registro de eventos ---- */
function starters(m,t){const P=m.teams[t].players;if(P.some(p=>p.pos!==undefined))return P.filter(p=>p.s).sort((a,b)=>a.pos-b.pos).map(lbl);if(P.some(p=>p.s!==undefined))return P.filter(p=>p.s).map(lbl);return P.filter(p=>m.rules.libServe||!p.l).slice(0,6).map(lbl)}
function lineup(m,t){
  const R=replay(m);let court;
  if(R.slots)court=R.slots[t].map(s=>s.on);   // P1..P6
  else{court=starters(m,t);for(const e of m.events)if(e.type==='sub'&&e.team===t)court=court.map(x=>x===e.out?e.in:x)}   // partidas antigas
  return{court,bench:m.teams[t].players.map(lbl).filter(x=>!court.includes(x))}}
const courtShort=(m,t)=>lineup(m,t).court.map(x=>(x.match(/^#\S+/)||[x])[0]).join(' ');
/* regras do líbero: nunca bloqueia; só saca se a formação for de 6 (líbero saca). all=true ignora quem está em quadra (edição de registros) */
const roster=(i,skill,all)=>{const on=all?null:lineup(cur,i).court;
  let L=cur.teams[i].players.filter(p=>!(p.l&&(skill==='block'||(skill==='serve'&&!cur.rules.libServe)))).map(lbl).filter(x=>!on||on.includes(x));
  if(!all&&skill==='serve'&&replay(cur).slots)L=L.filter(x=>x===on[0]);   // so quem esta na P1 saca
  return L};
/* mini-quadra de cada equipe (rede em cima): P4 P3 P2 / P5 P6 P1. P1 = sacador */
function courtGrid(m,t,R){
  if(!R.slots)return '<div class="mut" style="font-size:12px">Em quadra: '+courtShort(m,t)+'</div>';
  const sl=R.slots[t],srv=R.serving===t&&!R.done;
  const cell=n=>{const s=sl[n-1],x=s.on,sh=(x.match(/^#\S+/)||[x.replace(/ \(L\)$/,'').slice(0,6)])[0];return '<span class="cp'+(n===1&&srv?' sv':'')+(s.on!==s.t?' lb':'')+'" title="P'+n+' '+esc(x)+'">'+esc(sh)+'</span>'};
  return '<div class="ct">'+[4,3,2,5,6,1].map(cell).join('')+'</div><div class="mut" style="font-size:11px">▲ rede · P1 saca</div>'}
/* indicador do proximo sacador (nunca mostra o libero) */
function srvBar(m,R){
  if(!R.slots||R.done)return'';
  const t=R.serving,lab=R.slots[t][0].t,p=m.teams[t].players.find(x=>lbl(x)===lab),nm=p&&!p.l?p.name:'—';
  return '<div class="srv t'+t+'x">Saque – <b>'+esc(m.teams[t].name)+'</b>: <b>'+esc(nm)+'</b>'+(p&&p.n&&!p.l?' <small>#'+esc(p.n)+'</small>':'')+(R.pts===0?' <button class="lnk" data-a="swap">Trocar saque</button>':'')+'</div>'}

/* ---- Views ---- */
function home(){
  const ms=[...DB.matches].reverse();
  return '<div class="hero"><img src="logo.jpg" alt="SETPOINT — sua súmula de vôlei" width="1000" height="563"><div class="cta">'+
  '<button class="big" data-a="new">+ Nova partida</button><button class="big ghost" data-a="teams">Criar e/ou adicionar equipes</button></div></div>'+acctCard()+'<h3>Partidas</h3>'+
  (ms.length?ms.map(m=>{const s=replay(m);return '<div class="mc"><div class="mt"><b>'+esc(m.name)+'</b><span class="pill'+(s.done?'':' on')+'">'+(s.done?'Encerrada':'Em andamento')+'</span></div><div class="res"><span class="n" style="color:var(--a)">'+esc(m.teams[0].name)+'</span><span class="s">'+s.w[0]+' × '+s.w[1]+'</span><span class="n" style="color:var(--b)">'+esc(m.teams[1].name)+'</span></div><div class="mut">'+new Date(m.created).toLocaleString('pt-BR')+'</div><div class="row" style="margin-top:10px"><button data-a="open" data-id="'+m.id+'">'+(s.done?'Abrir':'Continuar')+'</button><button data-a="rep" data-id="'+m.id+'">Súmula</button><button data-a="editm" data-id="'+m.id+'">Editar</button><button class="dn" data-a="rm" data-id="'+m.id+'">Excluir</button></div></div>'}).join(''):'<p class="mut">Nenhuma partida ainda. Crie a primeira para começar.</p>')+
  '<div class="row" style="margin-top:12px"><button style="flex:1" data-a="exp">Exportar backup</button><button style="flex:1" data-a="imp">Importar backup</button></div><input type="file" id="impf" accept="application/json,.json" hidden><p class="mut" style="text-align:center">Dados salvos neste aparelho. Faça backup de vez em quando. · v1.8</p>';

/* ================= NUVEM (Supabase Auth + REST via fetch, sem bibliotecas) =================
 Offline primeiro: o app sempre grava no aparelho; a nuvem é uma cópia sincronizada em segundo plano.
 - Cada conta tem seu próprio armazenamento local (setpoint:u:<id>); sem conta usa setpoint:v1. Nada se mistura.
 - save() detecta o que mudou (track) e marca como pendente (DB.sync.dirty / DB.sync.del).
 - sync(): 1) baixa mudanças (pull)  2) envia pendências (push, upsert por user_id+id: não duplica).
 - Conflito: vence a alteração mais recente (campo u, em ms). Exclusão = registro com deleted=true. */
let CFG=window.SETPOINT_CFG||{},CFG_SRC=CFG.url&&CFG.key?'config.js':'';

const sig=x=>JSON.stringify(x,(k,v)=>(k==='sc'||k==='set')?undefined:v),SIGK=(k,x)=>k+':'+x.id;

/* ---- HTTP e sessão ---- */
async function api(path,o={}){
  const h={apikey:CFG.key,'Content-Type':'application/json',...(o.headers||{})};
  if(o.auth!==false&&SES&&!h.Authorization)h.Authorization='Bearer '+SES.access_token;
  const r=await fetch(CFG.url.replace(/\/$/,'')+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+r.status));e.status=r.status;e.code=j&&(j.error_code||j.code);throw e}
  return j;
}
const saveSes=s=>{SES=s;try{s?localStorage.setItem('setpoint:auth',JSON.stringify(s)):localStorage.removeItem('setpoint:auth')}catch(e){}};
const mkSes=j=>({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email,name:(j.user.user_metadata||{}).name||''}});
/* renova o token quando faltam <60 s; só encerra a sessão se o servidor recusar o refresh (sem internet não desloga) */
async function fresh(){
  if(!SES)return false;
  if(SES.expires_at-Date.now()/1000>60)return true;
  try{const j=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:SES.refresh_token}});saveSes(mkSes({...j,user:j.user||{id:SES.user.id,email:SES.user.email,user_metadata:{name:SES.user.name}}}));return true}
  catch(e){if(e.status===400||e.status===401||e.status===403){forceOut();return false}throw e}
}
function authMsg(e){const c=e.code||'',m=(e.message||'').toLowerCase();
  if(!e.status)return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  if(c==='invalid_credentials'||m.includes('invalid login'))return 'E-mail ou senha incorretos.';
  if(c==='email_not_confirmed'||m.includes('not confirmed'))return 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam). Se o link expirou, toque em “Reenviar e-mail de confirmação”.';
  if(c==='user_already_exists'||m.includes('already registered'))return 'Este e-mail já tem conta. Use “Entrar” ou recupere a senha.';
  if(c==='same_password')return 'Escolha uma senha diferente da anterior.';
  if(e.status===429||c.includes('rate_limit'))return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
  if(c==='weak_password'||m.includes('password'))return 'Senha fraca: use pelo menos 6 caracteres.';
  if(c==='validation_failed'||m.includes('email'))return 'Confira o e-mail digitado.';
  return 'Não foi possível concluir ('+(c||e.status)+').';
}

/* ---- Sincronização ---- */
const abort=()=>Object.assign(new Error('abort'),{abort:true});
function schedSync(ms){if(!CLOUD||!SES)return;clearTimeout(SY.t);SY.t=setTimeout(sync,ms||2500)}
async function sync(){
  if(!CLOUD||!SES)return;
  if(SY.busy){SY.again=true;return}
  if(!navigator.onLine){paintSync();return}
  const my=KEY;SY.busy=true;SY.err='';paintSync();
  try{
    if(!(await fresh())||KEY!==my)return;
    for(const k of['teams','matches'])await pull(k,my);
    await push(my);
    SY.r401=false;
    if(cur){cur=DB.matches.find(x=>x.id===cur.id)||null;if(!cur&&view==='live')go('home')}
    if(['home','teams'].includes(view)&&!$('#modal').innerHTML)render();
  }catch(e){
    if(!e.abort){SY.err=e.status?('Erro '+e.status):'rede';if(e.status===401&&!SY.r401){SY.r401=true;SES.expires_at=0;saveSes(SES);SY.again=true}}
  }finally{persist();SY.busy=false;paintSync();if(SY.again){SY.again=false;schedSync(800)}}
}
function applyRow(k,r){
  const arr=DB[k],i=arr.findIndex(x=>x.id===r.id),loc=arr[i],lu=loc?(loc.u||0):0,dirty=!!(loc&&DB.sync.dirty[k][r.id]);
  const tb=DB.sync.del.find(d=>d.k===k&&d.id===r.id);
  if(tb){if(tb.u>=r.client_updated)return;DB.sync.del=DB.sync.del.filter(d=>d!==tb)}
  if(r.deleted){if(dirty&&lu>r.client_updated)return;if(i>=0)arr.splice(i,1);delete DB.sync.dirty[k][r.id];return}
  if(loc&&lu>=r.client_updated)return;
  const item={...r.data,id:r.id,u:r.client_updated};if(k==='teams'&&Array.isArray(item.players)&&!item.players.every(p=>p.fn))item.players=upgradePlayers(item.players);
  if(i>=0)arr[i]=item;else arr.push(item);
  SIG[SIGK(k,item)]=sig(item);delete DB.sync.dirty[k][r.id];
}
async function pull(k,my){
  const last=DB.sync.last[k]||'1970-01-01T00:00:00+00:00';let off=0,max=last;
  for(;;){
    const rows=await api('/rest/v1/'+k+'?select=id,name,data,client_updated,deleted,updated_at&updated_at=gte.'+encodeURIComponent(last)+'&order=updated_at.asc,id.asc&limit=200&offset='+off);
    if(KEY!==my)throw abort();
    for(const r of rows){applyRow(k,r);if(r.updated_at>max)max=r.updated_at}
    if(rows.length<200)break;off+=200;
  }
  DB.sync.last[k]=max;
}
async function push(my){
  for(const k of['teams','matches']){
    const rows=[],snap={};
    for(const id of Object.keys(DB.sync.dirty[k])){const x=DB[k].find(y=>y.id===id);if(!x){delete DB.sync.dirty[k][id];continue}snap[id]=x.u;rows.push({user_id:SES.user.id,id,name:x.name||'',data:x,client_updated:x.u||0,deleted:false})}
    for(const d of DB.sync.del.filter(d=>d.k===k))rows.push({user_id:SES.user.id,id:d.id,name:'',data:{},client_updated:d.u,deleted:true});
    for(let i=0;i<rows.length;i+=10){
      const part=rows.slice(i,i+10);
      await api('/rest/v1/'+k+'?on_conflict=user_id,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:part});
      if(KEY!==my)throw abort();
      for(const r of part){
        if(r.deleted)DB.sync.del=DB.sync.del.filter(d=>!(d.k===k&&d.id===r.id));
        else{const x=DB[k].find(y=>y.id===r.id);if(x&&x.u===snap[r.id])delete DB.sync.dirty[k][r.id]}
      }
      persist();
    }
  }
}

    const url=($('#c_url').value||'').trim().replace(/\/$/,''),key=($('#c_key').value||'').trim(),say=t=>{$('#amsg').textContent=t};
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url))return say('A URL deve ser parecida com https://abcdefgh.supabase.co');
    let role='';try{role=JSON.parse(atob(key.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){}
    if(/sb_secret/.test(key)||role==='service_role')return say('Essa é uma chave secreta. Use só a chave publishable (sb_publishable_…) ou anon.');
    if(key.length<20)return say('Cole a chave publishable inteira.');
    try{localStorage.setItem('setpoint:cfg',JSON.stringify({url,key}))}catch(e){return say('Não foi possível salvar neste aparelho.')}
    location.reload()}
  else if(a==='am'){flow.am=d.m;flow.amsg=null;go('auth')}
  else if(a==='doin'||a==='doup'||a==='dorec'||a==='dores'||a==='donew')authAct(a);
  else if(a==='syncnow')sync();
  else if(a==='signout'){if(pending()&&!navigator.onLine)openM('<h3>Sair da conta?</h3><p>Há '+pending()+' alteração(ões) ainda não enviadas. Elas ficam guardadas neste aparelho e serão enviadas quando você entrar de novo com internet.</p><div class="grid"><button class="big dn" data-a="signoutok">Sair</button><button class="big" data-a="close2">Cancelar</button></div>');else signOut()}
  else if(a==='signoutok')signOut();
  else if(a==='adopt'){const g=flow.guest;if(g){for(const k of['matches','teams'])for(const x of g[k])if(!DB[k].some(y=>y.id===x.id))DB[k].push(JSON.parse(JSON.stringify(x)));try{localStorage.setItem(GUEST_KEY,JSON.stringify({matches:[],teams:[]}))}catch(e){}flow.guest=null;save();closeM();render();sync()}}
  else if(a==='keepg'){flow.guest=null;closeM()}
  else if(a==='tnew'){ED={id:null,back:'teams',side:null};go('team')}
  else if(a==='topen'){ED={id:d.id,back:'teams',side:null};go('team')}
  else if(a==='tback')go(ED.back||'teams');
  else if(a==='tdup'){const t=DB.teams.find(x=>x.id===d.id);if(t){let nm=t.name+' (cópia)',k=2;while(DB.teams.some(x=>x.name===nm))nm=t.name+' (cópia '+(k++)+')';DB.teams.push({...JSON.parse(JSON.stringify(t)),id:uid(),name:nm,created:Date.now(),updated:Date.now()});save();render()}}
  else if(a==='trm'){flow.rmt=d.id;openM('<h3>Excluir equipe?</h3><p>As partidas já jogadas não são afetadas: cada uma guarda a sua própria cópia da equipe.</p><div class="grid"><button class="big dn" data-a="trmok">Excluir</button><button class="big" data-a="close2">Cancelar</button></div>')}
  else if(a==='trmok'){tomb('teams',flow.rmt);DB.teams=DB.teams.filter(x=>x.id!==flow.rmt);save();ED.id=null;if(view==='team')go('teams');else{closeM();render()}}
  else if(a==='tsave'){
    const name=$('#t_name').value.trim(),P=rd('t'),er=[];
    if(!name)er.push('Dê um nome à equipe.');
    if(DB.teams.some(t=>t.id!==ED.id&&t.name.trim().toLowerCase()===name.toLowerCase()))er.push('Já existe uma equipe com esse nome.');
    if(!P.length)er.push('Adicione pelo menos um jogador.');
    er.push(...rosterErrors(clean(P),false));
    if(er.length)return showErr([...new Set(er)]);
    const pl=clean(P);
    let t=ED.id&&DB.teams.find(x=>x.id===ED.id);
    if(t){t.name=name;t.players=pl;t.updated=Date.now()}else{t={id:uid(),name,players:pl,created:Date.now(),updated:Date.now()};DB.teams.push(t)}
    save();ED.id=t.id;
    if(ED.back==='setup'&&flow.draft)flow.draft[ED.side]=t.id;
    go(ED.back||'teams')}
  else if(a==='open'){cur=find(d.id);go('live')}
  else if(a==='rep'){cur=find(d.id);flow.from=view;go('report')}
  else if(a==='back')go('live');
  else if(a==='endm')openM('<h3>Encerrar partida agora?</h3><p>A partida fica marcada como encerrada com o placar atual. Você pode reabrir depois.</p><div class="grid"><button class="big pri" data-a="endok">Encerrar</button><button class="big" data-a="close2">Cancelar</button></div>');
  else if(a==='endok'){cur.events.push({id:uid(),type:'end',t:Date.now()});save();closeM();render();endModal()}
  else if(a==='reopen'){const i=cur.events.map(e=>e.type).lastIndexOf('end');if(i>=0)cur.events.splice(i,1);save();render()}
  else if(a==='editm'){if(d.id)cur=find(d.id);go('edit')}
  else if(a==='rdem'){const p=RS[d.k][+d.i];p.s=false;delete p.pos;renderRoster(d.k)}
  else if(a==='rpro'){const P=RS[d.k],used=new Set(P.filter(x=>x.s).map(x=>x.pos)),pos=[1,2,3,4,5,6].find(n=>!used.has(n));if(pos){const p=P[+d.i];p.s=true;p.pos=pos}renderRoster(d.k)}
  else if(a==='radd'){RS[d.k].push(d.t==='lib'?{n:'',name:'',fn:'lib',s:false,l:true}:{n:'',name:'',fn:'pon',s:false,l:false});renderRoster(d.k)}
  else if(a==='rrm'){RS[d.k].splice(+d.i,1);renderRoster(d.k)}
  else if(a==='saveedit'){const er=validate([$('#f_ta').value.trim(),$('#f_tb').value.trim()],[rd('a'),rd('b')],readRules());if(er.length)return showErr(er);
    /* renomear jogador: reescreve o nome nos eventos já registrados da mesma equipe */
    const map=[{},{}];
    [0,1].forEach(t=>{const old=cur.teams[t].players,nw=rd(t?'b':'a');
      nw.forEach(p=>{if(p.i!=null&&old[p.i]&&lbl(old[p.i])!==lbl(p))map[t][lbl(old[p.i])]=lbl(p)});
      cur.teams[t]={name:$(t?'#f_tb':'#f_ta').value.trim()||'Equipe '+'AB'[t],players:clean(nw)}});
    cur.events.forEach(e=>['p','lib','out','in'].forEach(k=>{const mp=map[k==='p'&&e.skill==='error'?1-e.team:e.team];if(mp&&mp[e[k]])e[k]=mp[e[k]]}));
    cur.name=$('#f_name').value.trim()||cur.name;cur.rules=readRules();cur.firstServe=+$('#f_fs').value||0;save();go('live')}
  else if(a==='restart'){const o=cur,m={id:uid(),created:Date.now(),name:o.name,teams:JSON.parse(JSON.stringify(o.teams)),rules:{...o.rules},firstServe:o.firstServe||0,events:[]};DB.matches.push(m);save();cur=m;go('live')}
  else if(a==='print')window.print();
  else if(a==='rm'){flow.rm=d.id;openM('<h3>Excluir partida?</h3><p>Esta ação não pode ser desfeita.</p><div class="row"><button data-a="rmok" class="dn">Excluir</button><button data-a="close2">Cancelar</button></div>')}
  else if(a==='rmok'){tomb('matches',flow.rm);DB.matches=DB.matches.filter(x=>x.id!==flow.rm);save();closeM();render()}
  else if(a==='close2')closeM();
  else if(a==='create'){
    const ta=DB.teams.find(x=>x.id===$('#s_ta').value),tb=DB.teams.find(x=>x.id===$('#s_tb').value),er0=[];
    if(!ta)er0.push('Escolha a Equipe A.');if(!tb)er0.push('Escolha a Equipe B.');if(ta&&ta===tb)er0.push('Escolha duas equipes diferentes.');
    if(er0.length)return showErr(er0);
    const snap=t=>({name:t.name,teamId:t.id,players:upgradePlayers(JSON.parse(JSON.stringify(t.players)))});
    const m={id:uid(),created:Date.now(),name:$('#f_name').value.trim()||ta.name+' × '+tb.name,teams:[snap(ta),snap(tb)],rules:readRules(),firstServe:+$('#f_fs').value||0,events:[]};
    const er=validate(m.teams.map(t=>t.name),m.teams.map(t=>t.players),m.rules);
    if(er.length)return showErr(er.map(x=>x+' (ajuste em “Criar e/ou adicionar equipes”)'));
    flow.draft=null;DB.matches.push(m);save();cur=m;go('live');
  }
  else if(a==='pt'){flow={team:+d.t};openSkill()}
  else if(a==='sk'){flow.skill=d.k;if(d.k==='serve'&&!flow.edit&&replay(cur).slots){const L=roster(flow.team,'serve');if(L.length===1){commit(L[0],'');return}}openPlayers()}
  else if(a==='swap'){const R=replay(cur);if(R.slots&&R.pts===0)add({type:'first',team:1-R.serving})}
  else if(a==='pl')commit(d.p,'');
  else if(a==='edit'){const e=cur.events.find(x=>x.id===d.id);flow={team:e.team,edit:e.id};openSkill()}
  else if(a==='del'){cur.events=cur.events.filter(x=>x.id!==d.id);save();render()}
  else if(a==='undo'){cur.events.pop();save();render()}
  else if(a==='to'){if(!replay(cur).done)add({type:'to',team:+d.t})}
  else if(a==='exp'){const b=new Blob([JSON.stringify({app:'setpoint',v:2,matches:DB.matches,teams:DB.teams})],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='setpoint-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else if(a==='imp')$('#impf').click();
  else if(a==='sub'){const t=+d.t,L=lineup(cur,t);
    if(!L.bench.length){openM('<h3>Sem reservas</h3><p>Não há jogadores no banco desta equipe. Adicione jogadores em Editar.</p><button class="big" data-a="close2">Fechar</button>');return}
    flow={team:t};const op=l=>l.map(x=>'<option>'+esc(x)+'</option>').join('');
    openM('<h3>Substituição — '+esc(cur.teams[t].name)+'</h3><label>Sai da quadra</label><select id="so">'+(replay(cur).slots?L.court.map((x,i)=>'<option value="'+esc(x)+'">P'+(i+1)+' · '+esc(x)+'</option>').join(''):op(L.court))+'</select><label>Entra</label><select id="si">'+op(L.bench)+'</select><button class="big pri" style="margin-top:12px" data-a="subok">Registrar</button>')}
  else if(a==='subok'){const o=$('#so').value,i=$('#si').value,P=cur.teams[flow.team].players,lib=x=>P.some(p=>lbl(p)===x&&p.l);add({type:'sub',team:flow.team,out:o,in:i,kind:lib(o)||lib(i)?'libero':'normal'})}
  else if(a==='note')openM('<h3>Observação</h3><textarea id="nt" placeholder="Ex.: atleta com dor no joelho"></textarea><button class="big pri" style="margin-top:12px" data-a="noteok">Salvar</button>');
  else if(a==='noteok'){const t=$('#nt').value.trim();if(t)add({type:'note',text:t});else closeM()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='f_pre'||e.target.value==='c')return;
  const [s,p,d,x]=e.target.value.split(',');$('#f_sw').value=s;$('#f_pts').value=p;$('#f_df').value=d;$('#f_dp').value=x;
});
document.addEventListener('input',e=>{if(e.target.id==='f_sw')syncDp()});
document.addEventListener('input',e=>{const ds=e.target.dataset||{};if(ds.f==='n'||ds.f==='name'){RS[ds.k][+ds.i][ds.f]=e.target.value;paintStatus(ds.k)}});
document.addEventListener('change',e=>{const ds=e.target.dataset||{};if(ds.rs==='slot'){slotPick(ds.k,+ds.pos,e.target.value);return}if(ds.f==='fn'){RS[ds.k][+ds.i].fn=e.target.value;renderRoster(ds.k);return}if(e.target.id==='s_ta'||e.target.id==='s_tb'){if(e.target.value==='__new'){flow.draft=draft();ED={id:null,back:'setup',side:e.target.id==='s_ta'?'a':'b'};go('team')}else updatePick()}if(e.target.id==='f_pre')syncDp();});
/* importar backup: soma partidas novas (mesmo id não duplica) */
document.addEventListener('change',e=>{if(e.target.id!=='impf'||!e.target.files[0])return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.matches))throw 0;let n=0;j.matches.forEach(m=>{if(m&&m.id&&m.teams&&m.rules&&Array.isArray(m.events)&&!DB.matches.some(x=>x.id===m.id)){DB.matches.push(m);n++}});(Array.isArray(j.teams)?j.teams:[]).forEach(t=>{if(t&&t.id&&t.name&&Array.isArray(t.players)&&!DB.teams.some(x=>x.id===t.id))DB.teams.push({...t,players:upgradePlayers(t.players)})});save();render();openM('<h3>Backup importado</h3><p>'+n+' partida(s) adicionada(s).</p><button class="big pri" data-a="close2">OK</button>')}catch(x){openM('<h3>Arquivo inválido</h3><p>Escolha um backup exportado pelo SETPOINT.</p><button class="big" data-a="close2">Fechar</button>')}};r.readAsText(e.target.files[0])});
setInterval(()=>{const c=$('#clk');if(c&&view==='live')c.textContent=dur(elapsed(replay(cur)))},1000);
initSigs();readHash();render();
addEventListener('online',()=>{paintSync();sync()});addEventListener('offline',paintSync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(()=>{if(!document.hidden)sync()},120000);
if(SES)setTimeout(sync,800);

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
